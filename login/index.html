<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==========================================================
         VIVAHA AI MATRIMONY
         Premium Login Page
         File : login/index.html
         ========================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Login | Vivaha</title>

    <meta name="description" content="Login to Vivaha AI Matrimony">
    <meta name="theme-color" content="#050505">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ==========================================================
         BACKGROUND
    =========================================================== -->

    <div class="background-light" aria-hidden="true"></div>

    <!-- ==========================================================
         LOADER
    =========================================================== -->

    <div id="loaderOverlay" class="loader-overlay hidden">

        <div class="loader-card">

            <div class="premium-spinner"></div>

            <p>Please wait...</p>

        </div>

    </div>

    <!-- ==========================================================
         MAIN
    =========================================================== -->

    <main class="login-page">

        <!-- Login Card -->

        <section class="login-card fade-up">

            <!-- Logo -->

            <div class="logo-wrapper">

                <img
                    src="../assets/brand-logo.png"
                    alt="Vivaha Logo"
                    class="brand-logo">

            </div>

            <!-- Heading -->

            <header class="heading-section">

                <h1>Welcome Back</h1>

                <p>
                    Continue your journey to find your perfect life partner.
                </p>

            </header>

            <!-- ======================================================
                 GOOGLE LOGIN
            ======================================================= -->

            <button
                id="googleLoginBtn"
                class="google-btn"
                type="button">

                <img
                    src="../assets/google.svg"
                    alt=""
                    aria-hidden="true">

                <span>Continue with Google</span>

            </button>

            <!-- Divider -->

            <div class="divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>

            <!-- ======================================================
                 PHONE LOGIN
            ======================================================= -->

            <form
                id="phoneForm"
                class="phone-form"
                autocomplete="off">

                <!-- Phone -->

                <div class="phone-input-wrapper">

                    <div class="country-code">

                        <img
                            src="../assets/phone.svg"
                            alt=""
                            aria-hidden="true">

                        <span>+91</span>

                    </div>

                    <input

                        id="phoneNumber"

                        type="tel"

                        maxlength="10"

                        inputmode="numeric"

                        placeholder="Enter Mobile Number"

                        autocomplete="tel"

                        required>

                </div>

                <button
                    id="continueBtn"
                    class="primary-btn"
                    type="submit">

                    Continue

                </button>

            </form>

            <!-- ======================================================
                 OTP SECTION
            ======================================================= -->

            <section
                id="otpSection"
                class="otp-section hidden">

                <h2>

                    Enter Verification Code

                </h2>

                <p>

                    We've sent a 6-digit OTP to your mobile number.

                </p>

                <!-- OTP -->

                <div class="otp-wrapper">

                    <input class="otp-box" maxlength="1" inputmode="numeric">

                    <input class="otp-box" maxlength="1" inputmode="numeric">

                    <input class="otp-box" maxlength="1" inputmode="numeric">

                    <input class="otp-box" maxlength="1" inputmode="numeric">

                    <input class="otp-box" maxlength="1" inputmode="numeric">

                    <input class="otp-box" maxlength="1" inputmode="numeric">

                </div>

                <button
                    id="verifyOtpBtn"
                    class="primary-btn"
                    type="button">

                    Verify

                </button>

                <button
                    id="resendOtpBtn"
                    class="text-btn"
                    type="button">

                    Resend OTP

                </button>

            </section>

        </section>

    </main>

    <!-- ==========================================================
         INVISIBLE RECAPTCHA
         Firebase Phone Authentication
    =========================================================== -->

    <div id="recaptcha-container"></div>

    <!-- ==========================================================
         FIREBASE CONFIG
         (Shared Project Config)
    =========================================================== -->

    <script type="module" src="../firebase/firebase-config.js"></script>

    <!-- ==========================================================
         LOGIN LOGIC
    =========================================================== -->

    <script type="module" src="login.js"></script>

</body>
  </html>
